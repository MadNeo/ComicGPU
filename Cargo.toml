[workspace]
members = ["crates/core", "crates/server", "crates/desktop"]
default-members = ["crates/core", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
