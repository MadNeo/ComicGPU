<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ComicGPU</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><small>COMIC RESTORATION STUDIO</small><h1>ComicGPU <span>Rust</span></h1></div><button id="theme">Licht / donker</button></header>
<main><aside><h2>Werkruimte</h2><label class="upload">Comics toevoegen<input id="upload" type="file" accept=".cbz,.cbr,.zip" multiple></label><label class="upload">Map toevoegen<input id="folder" type="file" webkitdirectory multiple></label><p id="hardware">Hardware controleren…</p><label>Comic<select id="books"></select></label><button id="remove">Comic verwijderen</button><hr><label>Profiel<select id="profile"><option value="digital">Digitale comic</option><option value="scan">Oude kleurenscan</option><option value="manga">Zwart-wit / manga</option></select></label><button id="apply">Profiel op alle pagina’s</button><label>Parallelle pagina’s<select id="workers"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><p>Meer parallelle pagina’s gebruiken meer geheugen. Begin met 1 bij grote scans.</p><label><input type="checkbox" id="allow"> Openstaande controles toestaan</label><button class="primary" id="export">Alle comics verwerken</button><div id="downloads"></div></aside>
<section><div role="status" id="status">Voeg een comic toe om te beginnen.</div><div id="editor" hidden><div class="toolbar"><label>Pagina<select id="pages"></select></label><button id="approve">Markeer als beoordeeld</button><label><input id="excluded" type="checkbox"> Uitsluiten</label></div><details open><summary>Controlelijst</summary><div id="review"></div></details><div class="controls" id="controls"></div><div class="toolbar"><button id="preview" class="primary">Voorvertoning bijwerken</button><label><input id="actual" type="checkbox"> Ware pixelgrootte (100%)</label></div><div class="comparison"><figure><figcaption>Origineel</figcaption><div class="viewport"><img id="before" alt="Originele pagina"></div></figure><figure><figcaption>Bewerkt</figcaption><div class="viewport"><img id="after" alt="Bewerkte pagina"></div></figure></div><p id="splitnote"></p></div></section></main><script src="/app.js"></script></body></html>
